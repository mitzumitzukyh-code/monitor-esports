name: Cambios PRO Telegram
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-cambios-pro
  cancel-in-progress: false
jobs:
  enviar:
    if: vars.TELEGRAM_CAMBIOS_PRO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CAMBIOS_PRO: ${{ vars.TELEGRAM_CAMBIOS_PRO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/enviar-cambios-pro.mjs
