name: Perfil comercial Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generar-avatar-telegram.py'
      - 'salida/stars/comandos.mjs'

permissions:
  contents: read

concurrency:
  group: telegram-perfil-comercial
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar generador de avatar
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generar avatar aprobado
        run: python3 scripts/generar-avatar-telegram.py
      - name: Actualizar nombre, descripción, comandos y avatar
        run: node scripts/configurar-perfil-telegram.mjs --avatar=/tmp/monitor-esports-avatar.jpg
