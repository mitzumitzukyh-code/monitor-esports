name: Health Check eSports

on:
  schedule:
    # Desfasado del monitor principal para revisar el estado DESPUÉS de una
    # corrida normal. Además actúa como watchdog: si GitHub omite una corrida
    # programada del monitor, este workflow rehace una pasada idempotente antes
    # de evaluar la salud.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  # Validar inmediatamente cualquier cambio al propio watchdog. Comparte el
  # mismo grupo de concurrencia del monitor, así que nunca toca producción en
  # paralelo con el ciclo normal.
  push:
    branches: [main]
    paths:
      - '.github/workflows/health-check.yml'

# MISMO grupo que Monitor TI2026. Así el watchdog/recovery y el ciclo normal
# se serializan; nunca pueden predecir ni enviar a la vez.
concurrency:
  group: monitor-ti2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_WEBHOOK_ERRORES: ${{ secrets.DISCORD_WEBHOOK_ERRORES }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas de integridad del calificador
        run: node --test pruebas/calificador-integridad.test.mjs pruebas/auditoria-produccion.test.mjs

      # WATCHDOG/RECOVERY. Los cron de GitHub Actions son best-effort y pueden
      # saltarse una ejecución. El 2026-09-17 el health siguió corriendo mientras
      # el monitor principal dejó de ser despachado durante horas. Esta pasada
      # idempotente evita que un fallo del scheduler congele cuotas y avisos.
      # Cada paso es tolerante a fallos para que el diagnóstico final SIEMPRE se
      # ejecute y diga con precisión qué subsistema sigue rojo.
      - name: Recuperar cuotas si el monitor perdió una corrida
        continue-on-error: true
        run: node datos/juegos/guardar-cuotas.mjs

      - name: Recuperar ciclo de Dota 2, CS2, LoL y Valorant
        continue-on-error: true
        run: node juez/vivo-esports.mjs dota2 cs2 lol valorant

      - name: Reintentar avisos pendientes de Discord
        continue-on-error: true
        run: node salida/discord-esports.mjs dota2 cs2 lol valorant

      - name: Reintentar avisos pendientes de Telegram
        continue-on-error: true
        run: node salida/telegram-esports.mjs dota2 cs2 lol valorant

      - name: Generar panel de control para validar datos
        run: node salida/web/generar.mjs

      - name: Detectar silencios peligrosos
        shell: bash
        run: |
          set -o pipefail
          node auditoria/health-check.mjs 2>&1 | tee health-check.txt

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check
          path: health-check.txt
          if-no-files-found: warn

      - name: Avisar health check rojo
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          detalle=$(tail -c 850 health-check.txt 2>/dev/null || printf 'El health check falló antes de producir diagnóstico.')
          node salida/errores.mjs "Health Check eSports" "$detalle"
